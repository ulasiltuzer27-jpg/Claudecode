name: Last Lantern (gizlilik politikasi sayfasi)

# Depo ayarlarinda Pages > Source = "GitHub Actions" secildikten sonra elle
# (Actions > bu is akisi > Run workflow) ya da docs degisince calisir.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "LastLantern/docs/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: LastLantern/docs
      - id: deployment
        uses: actions/deploy-pages@v4
