[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
burn = { version = "0.22.1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
sosis-tokenizer = { path = "crates/sosis-tokenizer" }
sosis-data = { path = "crates/sosis-data" }
sosis-model = { path = "crates/sosis-model", default-features = false }
sosis-train = { path = "crates/sosis-train" }
sosis-infer = { path = "crates/sosis-infer" }

[profile.release]
opt-level = 3
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
