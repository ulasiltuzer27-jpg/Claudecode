# Sosy 1.0 — ana kod modeli (~97M parametre)
# RTX 4060 Ti 8 GB: ~4-6 GB VRAM (micro_batch 2 + gradient checkpointing).
# 40k adım x 65k token = ~2.6B token.

[model]
name = "Sosy 1.0"
vocab_size = 16384
d_model = 768
n_layers = 12
n_heads = 12         # head_dim = 64
ffn_hidden = 2048
max_seq_len = 1024
rope_theta = 10000.0

[train]
data_dir = "data"
tokenizer = "tokenizer.json"
out_dir = "runs/sosy-1.0"
backend = "auto"
precision = "f32"
gradient_checkpointing = true

seq_len = 1024
micro_batch = 2
grad_accum = 32      # adım başına 2 * 32 * 1024 = 65.536 token
max_steps = 40000
warmup_steps = 1000
lr = 6e-4
min_lr = 6e-5
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0

log_every = 10
eval_every = 1000
eval_batches = 20
save_every = 1000
keep_checkpoints = 3
seed = 1337
