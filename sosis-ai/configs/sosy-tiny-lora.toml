# Sosy-Tiny LoRA — CPU'da LoRA denemesi (demo/runs/sosy-tiny tabanı üzerine).

[model]
name = "Sosy-Tiny (proje)"
vocab_size = 2048
n_kv_heads = 2
d_model = 128
n_layers = 4
n_heads = 4
ffn_hidden = 352
max_seq_len = 256

[train]
data_dir = "demo/data-proje"
tokenizer = "demo/tokenizer.json"
out_dir = "demo/runs/sosy-tiny-lora"
init_from = "demo/runs/sosy-tiny"
backend = "cpu"

seq_len = 128
micro_batch = 8
grad_accum = 1
max_steps = 120
warmup_steps = 10
lr = 3e-3
min_lr = 3e-4
weight_decay = 0.0
grad_clip = 1.0

log_every = 30
eval_every = 60
eval_batches = 4
save_every = 60
keep_checkpoints = 1
seed = 11

[train.lora]
rank = 8
alpha = 16.0
