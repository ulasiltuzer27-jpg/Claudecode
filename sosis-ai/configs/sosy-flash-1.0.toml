# Sosy-Flash 1.0 — hızlı, küçük kod modeli (~27M parametre)
# RTX 4060 Ti 8 GB: ~3 GB VRAM. 20k adım x 65k token = ~1.3B token.
# Damıtma için: aşağıdaki [distill] bölümünün yorumunu kaldırın (önce Sosy-Pro / Sosy 1.0 eğitilmeli).

[model]
name = "Sosy-Flash 1.0"
vocab_size = 32768
d_model = 384
n_layers = 8
n_heads = 6          # head_dim = 64
ffn_hidden = 1024
max_seq_len = 512
rope_theta = 10000.0

[inference]
context = 1024       # 512'de eğitilir, RoPE ölçeklemeyle 1024'e uzatılır

[train]
data_dir = "data"
tokenizer = "tokenizer.json"
out_dir = "runs/sosy-flash-1.0"
backend = "auto"     # cuda | cpu | auto
precision = "f32"    # f32 | bf16
gradient_checkpointing = false
optimizer_offload = false
max_ram_gb = 28

seq_len = 512
micro_batch = 8      # VRAM yetmezse düşürün, grad_accum'u aynı oranda artırın
grad_accum = 16      # adım başına 8 * 16 * 512 = 65.536 token
max_steps = 20000
warmup_steps = 500
lr = 1e-3
min_lr = 1e-4
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0

log_every = 10
eval_every = 500
eval_batches = 20
save_every = 1000
keep_checkpoints = 3
seed = 1337

# [distill]
# teacher = "runs/sosy-pro-1.0"   # aynı tokenizer'la eğitilmiş öğretmen
# alpha = 0.5                     # kayıp = alpha*CE + (1-alpha)*T²*KL
# temperature = 2.0
