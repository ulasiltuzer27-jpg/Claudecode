# Sosy-Pro 1.0 — 3. aşama (isteğe bağlı): bağlamı 4096'ya genişletme (~0.25B token), flash attention ile.
# 2. aşamanın (configs/sosy-pro-1.0-ctx2048.toml) ağırlıklarıyla başlar.
# Flash attention dikkat matrisini (t×t) hiç saklamaz: CPU ölçümünde tek katman, 8 kafa, t=4096
# ileri+geri tepe bellek 2.18 GB → 87 MB. GPU'daki gerçek hız/bellek kartınızda ölçülmelidir;
# sorun çıkarsa attention = "standard" yapıp micro_batch = 1 ile devam edebilirsiniz.

[model]
name = "Sosy-Pro 1.0"
vocab_size = 32768
d_model = 1024
n_layers = 22
n_heads = 16
n_kv_heads = 4
ffn_hidden = 2816
max_seq_len = 4096
rope_theta = 10000.0
attention = "flash"  # "standard" | "flash" — ağırlıklar aynıdır, yalnızca hesaplama yolu değişir

[inference]
context = 8192       # 4096'da eğitilir; 4096 üstünde kalite bir miktar düşer

[train]
data_dir = "data"
tokenizer = "tokenizer.json"
out_dir = "runs/sosy-pro-1.0-ctx4096"
init_from = "runs/sosy-pro-1.0-ctx2048"
backend = "auto"
precision = "bf16"
gradient_checkpointing = true
optimizer_offload = true
max_ram_gb = 28
prefetch_steps = 2

seq_len = 4096
micro_batch = 1
grad_accum = 16      # adım başına 1 * 16 * 4096 = 65.536 token
max_steps = 3800
warmup_steps = 100
lr = 5e-5
min_lr = 5e-6
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0

log_every = 10
eval_every = 500
eval_batches = 10
save_every = 250
keep_checkpoints = 3
seed = 4096
