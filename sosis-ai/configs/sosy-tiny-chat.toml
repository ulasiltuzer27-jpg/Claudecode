# Sosy-Tiny Chat — CPU'da SFT denemesi (demo/runs/sosy-tiny'den başlar).

[model]
name = "Sosy-Tiny Chat"
vocab_size = 2048
n_kv_heads = 2
d_model = 128
n_layers = 4
n_heads = 4
ffn_hidden = 352
max_seq_len = 256

[train]
data_dir = "demo/data-sft"
tokenizer = "demo/tokenizer.json"
out_dir = "demo/runs/sosy-tiny-chat"
init_from = "demo/runs/sosy-tiny"
backend = "cpu"
precision = "bf16"
optimizer_offload = true

seq_len = 256
micro_batch = 8
grad_accum = 1
max_steps = 150
warmup_steps = 10
lr = 1e-3
min_lr = 1e-4
weight_decay = 0.0
grad_clip = 1.0

log_every = 25
eval_every = 75
eval_batches = 4
save_every = 75
keep_checkpoints = 1
seed = 7
