# Sosy-Pro 1.0 — LoRA ile kendi projenize özel ayar.
# Taban donar; yalnızca küçük adaptörler (~20 MB) eğitilir. Birkaç saat yeterli olur.
#   sosis prepare -i ~/oyun_kodum -t tokenizer.json -o data-proje --near-dedup
#   sosis train -c configs/sosy-pro-1.0-lora.toml
#   sosis generate -r runs/sosy-pro-1.0-lora ...      (taban + adaptör otomatik yüklenir)
#   sosis merge -r runs/sosy-pro-1.0-lora -o runs/sosy-pro-1.0-proje   (tek başına model)

[model]
name = "Sosy-Pro 1.0 (proje)"
vocab_size = 32768
d_model = 1024
n_layers = 22
n_heads = 16
n_kv_heads = 4
ffn_hidden = 2816
max_seq_len = 2048
rope_theta = 10000.0

[inference]
context = 4096

[train]
data_dir = "data-proje"
tokenizer = "tokenizer.json"
out_dir = "runs/sosy-pro-1.0-lora"
init_from = "runs/sosy-pro-1.0-ctx2048"
backend = "auto"
precision = "bf16"
gradient_checkpointing = true
max_ram_gb = 28

seq_len = 2048
micro_batch = 1
grad_accum = 16
max_steps = 1500
warmup_steps = 50
lr = 2e-4
min_lr = 2e-5
weight_decay = 0.0
grad_clip = 1.0

log_every = 10
eval_every = 100
eval_batches = 10
save_every = 100
keep_checkpoints = 2
seed = 11

[train.lora]
rank = 16
alpha = 32.0
qlora = false   # true: taban int8 (daha az VRAM, biraz daha yavaş)
