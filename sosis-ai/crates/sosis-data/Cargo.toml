[package]
name = "sosis-data"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sosis AI veri hattı: kod toplama, filtreleme, FIM, token shard'ları"

[dependencies]
sosis-tokenizer = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
memmap2 = "0.9"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
parquet = { version = "60.1.0", default-features = false, features = ["snap", "zstd", "flate2-rust_backend", "lz4"] }
