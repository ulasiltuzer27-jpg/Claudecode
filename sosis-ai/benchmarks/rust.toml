[[task]]
id = "fizzbuzz"
prompt = """/// 3'e bölünürse "Fizz", 5'e bölünürse "Buzz", ikisine de bölünürse "FizzBuzz", değilse sayının kendisi.
fn fizzbuzz(n: u32) -> String {
"""
solution = """    match (n % 3, n % 5) {
        (0, 0) => "FizzBuzz".to_string(),
        (0, _) => "Fizz".to_string(),
        (_, 0) => "Buzz".to_string(),
        _ => n.to_string(),
    }
}
"""
tests = """fn main() {
    assert_eq!(fizzbuzz(1), "1");
    assert_eq!(fizzbuzz(3), "Fizz");
    assert_eq!(fizzbuzz(10), "Buzz");
    assert_eq!(fizzbuzz(15), "FizzBuzz");
}
"""

[[task]]
id = "binary_search"
prompt = """/// Sıralı dizide hedefin indeksini ikili arama ile bulur; yoksa None.
fn binary_search(xs: &[i32], target: i32) -> Option<usize> {
"""
solution = """    let (mut lo, mut hi) = (0usize, xs.len());
    while lo < hi {
        let mid = (lo + hi) / 2;
        if xs[mid] == target {
            return Some(mid);
        } else if xs[mid] < target {
            lo = mid + 1;
        } else {
            hi = mid;
        }
    }
    None
}
"""
tests = """fn main() {
    let v = [1, 3, 5, 7, 9, 11];
    assert_eq!(binary_search(&v, 7), Some(3));
    assert_eq!(binary_search(&v, 1), Some(0));
    assert_eq!(binary_search(&v, 4), None);
    assert_eq!(binary_search(&[], 4), None);
}
"""

[[task]]
