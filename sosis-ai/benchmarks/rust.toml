[[task]]
id = "power"
prompt = """/// base üssü exp değerini döndürür (hızlı üs alma).
fn power(base: u64, exp: u32) -> u64 {
"""
solution = """    let (mut result, mut b, mut e) = (1u64, base, exp);
    while e > 0 {
        if e & 1 == 1 {
            result *= b;
        }
        e >>= 1;
        if e > 0 {
            b *= b;
        }
    }
    result
}
"""
tests = """fn main() {
    assert_eq!(power(2, 10), 1024);
    assert_eq!(power(7, 0), 1);
    assert_eq!(power(3, 13), 1594323);
}
"""

[[task]]
id = "is_anagram"
prompt = """/// İki kelime birbirinin anagramı mı? (büyük/küçük harf ayrımı yok)
fn is_anagram(a: &str, b: &str) -> bool {
"""
solution = """    let norm = |s: &str| {
        let mut v: Vec<char> = s.to_lowercase().chars().collect();
        v.sort();
        v
    };
    norm(a) == norm(b)
}
"""
tests = """fn main() {
    assert!(is_anagram("Listen", "Silent"));
    assert!(!is_anagram("abc", "abd"));
    assert!(is_anagram("", ""));
}
"""

[[task]]
id = "remove_duplicates"
prompt = """/// Tekrar eden elemanları, ilk görülme sırasını koruyarak çıkarır.
fn remove_duplicates(v: Vec<i32>) -> Vec<i32> {
"""
solution = """    let mut seen = std::collections::HashSet::new();
    v.into_iter().filter(|x| seen.insert(*x)).collect()
}
"""
tests = """fn main() {
    assert_eq!(remove_duplicates(vec![1, 2, 1, 3, 2]), vec![1, 2, 3]);
    assert_eq!(remove_duplicates(vec![]), Vec::<i32>::new());
    assert_eq!(remove_duplicates(vec![4, 4, 4]), vec![4]);
}
"""

[[task]]
id = "caesar"
prompt = """/// Sezar şifresi: İngilizce harfleri `shift` kadar kaydırır, büyük/küçük harfi korur, diğerlerini değiştirmez.
fn caesar(s: &str, shift: u8) -> String {
"""
solution = """    s.chars()
        .map(|c| {
            if c.is_ascii_lowercase() {
                (((c as u8 - b'a' + shift) % 26) + b'a') as char
            } else if c.is_ascii_uppercase() {
                (((c as u8 - b'A' + shift) % 26) + b'A') as char
            } else {
                c
            }
        })
        .collect()
}
"""
tests = """fn main() {
    assert_eq!(caesar("abc", 1), "bcd");
    assert_eq!(caesar("xyz", 3), "abc");
    assert_eq!(caesar("Hello, World!", 13), "Uryyb, Jbeyq!");
}
"""

[[task]]
id = "digit_sum"
prompt = """/// Sayının rakamları toplamını döndürür.
fn digit_sum(mut n: u64) -> u64 {
"""
solution = """    let mut s = 0;
    while n > 0 {
        s += n % 10;
        n /= 10;
    }
    s
}
"""
tests = """fn main() {
    assert_eq!(digit_sum(0), 0);
    assert_eq!(digit_sum(12345), 15);
    assert_eq!(digit_sum(9999), 36);
}
"""

[[task]]
id = "transpose"
prompt = """/// Dikdörtgen bir matrisin devriğini (transpose) döndürür.
fn transpose(m: &[Vec<i32>]) -> Vec<Vec<i32>> {
"""
solution = """    if m.is_empty() {
        return vec![];
    }
    (0..m[0].len())
        .map(|j| m.iter().map(|row| row[j]).collect())
        .collect()
}
"""
tests = """fn main() {
    assert_eq!(transpose(&[vec![1, 2, 3], vec![4, 5, 6]]), vec![vec![1, 4], vec![2, 5], vec![3, 6]]);
    assert_eq!(transpose(&[]), Vec::<Vec<i32>>::new());
}
"""

[[task]]
id = "balanced_brackets"
prompt = """/// (), [] ve {} parantezleri dengeli mi? Diğer karakterler yok sayılır.
fn balanced_brackets(s: &str) -> bool {
"""
solution = """    let mut stack = Vec::new();
    for c in s.chars() {
        match c {
            '(' | '[' | '{' => stack.push(c),
            ')' => if stack.pop() != Some('(') { return false; },
            ']' => if stack.pop() != Some('[') { return false; },
            '}' => if stack.pop() != Some('{') { return false; },
            _ => {}
        }
    }
    stack.is_empty()
}
"""
tests = """fn main() {
    assert!(balanced_brackets("fn a() { let x = [1, (2)]; }"));
    assert!(!balanced_brackets("(]"));
    assert!(!balanced_brackets("(("));
    assert!(balanced_brackets(""));
}
"""
