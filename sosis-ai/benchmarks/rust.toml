# Sosis AI derle-çalıştır görevleri (Rust).
# prompt: modele verilen başlangıç (açıklama + imza). solution: referans devam (düzeneğin kendini testi için).
# tests: programın sonuna eklenen `main`; panik / sıfır olmayan çıkış = başarısız.
lang = "rust"
file = "main.rs"

[[task]]
id = "fibonacci"
prompt = """/// n'inci Fibonacci sayısını döndürür: fib(0) = 0, fib(1) = 1.
fn fibonacci(n: u64) -> u64 {
"""
solution = """    let (mut a, mut b) = (0u64, 1u64);
    for _ in 0..n {
        let t = a + b;
        a = b;
        b = t;
    }
    a
}
"""
tests = """fn main() {
    assert_eq!(fibonacci(0), 0);
    assert_eq!(fibonacci(1), 1);
    assert_eq!(fibonacci(10), 55);
    assert_eq!(fibonacci(30), 832040);
}
"""

[[task]]
id = "is_prime"
prompt = """/// Sayının asal olup olmadığını döndürür.
fn is_prime(n: u64) -> bool {
"""
solution = """    if n < 2 {
        return false;
    }
    let mut i = 2;
    while i * i <= n {
        if n % i == 0 {
            return false;
        }
        i += 1;
    }
    true
}
"""
tests = """fn main() {
    assert!(!is_prime(0));
    assert!(!is_prime(1));
    assert!(is_prime(2));
    assert!(is_prime(97));
    assert!(!is_prime(91));
    assert!(is_prime(7919));
}
"""

[[task]]
id = "gcd"
prompt = """/// İki sayının en büyük ortak bölenini döndürür.
fn gcd(a: u64, b: u64) -> u64 {
"""
solution = """    if b == 0 { a } else { gcd(b, a % b) }
}
"""
tests = """fn main() {
    assert_eq!(gcd(12, 18), 6);
    assert_eq!(gcd(17, 5), 1);
    assert_eq!(gcd(0, 9), 9);
    assert_eq!(gcd(100, 75), 25);
}
"""

[[task]]
