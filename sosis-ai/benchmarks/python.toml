[[task]]
id = "merge_sorted"
prompt = '''def merge_sorted(a, b):
    """İki sıralı listeyi tek sıralı listede birleştirir."""
'''
solution = '''    i = j = 0
    out = []
    while i < len(a) and j < len(b):
        if a[i] <= b[j]:
            out.append(a[i]); i += 1
        else:
            out.append(b[j]); j += 1
    return out + a[i:] + b[j:]
'''
tests = '''
assert merge_sorted([1, 4, 7], [2, 3, 8]) == [1, 2, 3, 4, 7, 8]
assert merge_sorted([], [1]) == [1]
'''

