[[task]]
id = "is_palindrome"
prompt = '''def is_palindrome(s):
    """Harf ve rakam dışındakileri yok sayarak, büyük/küçük harf ayırmadan palindrom mu?"""
'''
solution = '''    t = [c.lower() for c in s if c.isalnum()]
