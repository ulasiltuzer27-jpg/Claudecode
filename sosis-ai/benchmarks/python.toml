[[task]]
id = "median"
prompt = '''def median(xs):
    """Sayı listesinin medyanını döndürür (çift uzunlukta ortadaki iki değerin ortalaması)."""
'''
solution = '''    s = sorted(xs)
    n = len(s)
    if n % 2 == 1:
        return s[n // 2]
    return (s[n // 2 - 1] + s[n // 2]) / 2
'''
tests = '''
assert median([3, 1, 2]) == 2
assert median([4, 1, 3, 2]) == 2.5
assert median([7]) == 7
'''

[[task]]
id = "to_roman"
prompt = '''def to_roman(n):
    """1..3999 arası tam sayıyı Roma rakamına çevirir."""
'''
solution = '''    vals = [(1000, "M"), (900, "CM"), (500, "D"), (400, "CD"), (100, "C"), (90, "XC"),
            (50, "L"), (40, "XL"), (10, "X"), (9, "IX"), (5, "V"), (4, "IV"), (1, "I")]
    out = ""
    for v, s in vals:
        while n >= v:
            out += s
            n -= v
    return out
'''
tests = '''
assert to_roman(4) == "IV"
assert to_roman(1994) == "MCMXCIV"
assert to_roman(3999) == "MMMCMXCIX"
'''

[[task]]
id = "running_sum"
prompt = '''def running_sum(xs):
    """Kümülatif toplamlar listesini döndürür: [1, 2, 3] -> [1, 3, 6]."""
'''
solution = '''    out, total = [], 0
    for x in xs:
        total += x
        out.append(total)
    return out
'''
tests = '''
assert running_sum([1, 2, 3]) == [1, 3, 6]
assert running_sum([]) == []
assert running_sum([5, -5]) == [5, 0]
'''

