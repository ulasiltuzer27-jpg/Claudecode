[[task]]
id = "balanced"
prompt = '''def balanced(s):
    """(), [] ve {} parantezleri dengeli mi? Diğer karakterler yok sayılır."""
'''
solution = '''    pairs = {")": "(", "]": "[", "}": "{"}
    stack = []
    for c in s:
        if c in "([{":
            stack.append(c)
        elif c in pairs:
            if not stack or stack.pop() != pairs[c]:
                return False
    return not stack
'''
tests = '''
assert balanced("f(a[1]) { }")
assert not balanced("(]")
assert not balanced("((")
'''

