[[task]]
id = "binary_search"
prompt = '''def binary_search(xs, target):
    """Sıralı listede hedefin indeksini döndürür; yoksa -1."""
'''
solution = '''    lo, hi = 0, len(xs) - 1
    while lo <= hi:
        mid = (lo + hi) // 2
        if xs[mid] == target:
            return mid
        if xs[mid] < target:
            lo = mid + 1
        else:
            hi = mid - 1
    return -1
'''
tests = '''
assert binary_search([1, 3, 5, 7], 5) == 2
assert binary_search([1, 3, 5, 7], 4) == -1
assert binary_search([], 1) == -1
'''

