# Sosis AI derle-çalıştır görevleri (Python).
# prompt: modele verilen başlangıç (imza + docstring). solution: referans gövde.
# tests: programın sonuna eklenen assert'ler; hata / sıfır olmayan çıkış = başarısız.
lang = "python"
file = "main.py"

[[task]]
id = "fibonacci"
prompt = '''def fibonacci(n):
    """n'inci Fibonacci sayısını döndürür: fibonacci(0) == 0, fibonacci(1) == 1."""
'''
solution = '''    a, b = 0, 1
    for _ in range(n):
        a, b = b, a + b
    return a
'''
tests = '''
assert fibonacci(0) == 0
assert fibonacci(1) == 1
assert fibonacci(10) == 55
assert fibonacci(30) == 832040
'''

[[task]]
id = "is_prime"
prompt = '''def is_prime(n):
    """Sayı asal ise True döndürür."""
'''
solution = '''    if n < 2:
        return False
    i = 2
    while i * i <= n:
        if n % i == 0:
            return False
        i += 1
    return True
'''
tests = '''
assert not is_prime(1)
assert is_prime(2)
assert is_prime(97)
assert not is_prime(91)
'''

[[task]]
id = "gcd"
prompt = '''def gcd(a, b):
    """İki tam sayının en büyük ortak bölenini döndürür."""
'''
solution = '''    while b:
        a, b = b, a % b
    return a
'''
tests = '''
assert gcd(12, 18) == 6
assert gcd(17, 5) == 1
assert gcd(0, 9) == 9
'''

